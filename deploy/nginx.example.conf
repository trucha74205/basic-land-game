# Add to your existing nginx. Certificates are handled by your existing setup (D-05).
limit_req_zone $binary_remote_addr zone=blg_api:10m rate=10r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 1701 ssl;
  http2 on;
  server_name pauli.mywire.org;
  # ssl_certificate / ssl_certificate_key: managed by your existing certificate handling
  client_max_body_size 16k;

  location /ws {
    proxy_pass http://blg:1701;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location /api/ {
    limit_req zone=blg_api burst=20 nodelay;
    proxy_pass http://blg:1701;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://blg:1701;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name pauli.mywire.org;
  # keep your existing /.well-known/acme-challenge/ location here, before the redirect (HTTP-01)
  location / { return 301 https://$host:1701$request_uri; }
}
